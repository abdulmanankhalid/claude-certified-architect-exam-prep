name: Daily Lesson

# Every night Claude writes one new lesson and opens a PR with its own GitHub
# App login. That login is trusted, so the checks start by themselves (no
# "Approve and run" click). The PR auto-merges once all required checks pass:
# markdown-only, claude-review and claude-safety-check.
on:
  schedule:
    # Cron uses UTC. 16:00 UTC = 9:00 PM Pakistan time (UTC+5).
    - cron: "0 16 * * *"
  # Adds a "Run workflow" button on the Actions tab, for testing any time
  workflow_dispatch:

# Never run two lesson jobs at once
concurrency:
  group: daily-lesson
  cancel-in-progress: false

jobs:
  lesson:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read   # Claude pushes with its own GitHub App login, not this token
      id-token: write  # needed by the Claude action to get that login
    steps:
      # 1. Copy the repo onto the temporary machine
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Today's date in Pakistan, used for the branch name
      - name: Get today's date (Pakistan time)
        id: today
        run: echo "date=$(TZ=Asia/Karachi date +%F)" >> "$GITHUB_OUTPUT"

      # 3. Claude writes the lesson, pushes a branch, opens a PR, turns on auto-merge
      - name: Write and ship today's lesson with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(ls:*),Bash(git checkout:*),Bash(git status:*),Bash(git diff:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr create:*),Bash(gh pr merge:*)"
          prompt: |
            You maintain a study repo for the Claude Certified Architect exam.
            Add ONE new lesson today (${{ steps.today.outputs.date }}).

            1. Choose the topic
               - Read README.md, every file in lessons/ (the folder may not exist yet),
                 and the other notes in the repo root.
               - Pick ONE topic useful for the exam that is not covered yet. Good areas:
                 Claude API and Messages API, tool use, prompt engineering, prompt caching,
                 context windows, agents and the Agent SDK, MCP, Claude Code (CLAUDE.md,
                 hooks, skills, subagents, CI), evaluation, safety and guardrails,
                 cost and latency trade-offs, architecture patterns.
               - Build on earlier lessons and move from basics to advanced over time.
                 Do not repeat or lightly reword an existing lesson.

            2. Write the lesson
               - Create lessons/NNN-short-topic-slug.md, where NNN is the next number
                 with leading zeros (001, 002, ...). The first line is "# <Lesson title>".
               - Structure: what you will learn (3 to 5 bullets); explanation in simple
                 language with small examples or code; common exam traps; 3 practice
                 questions with answers in a collapsible <details> block; key takeaways.
               - In README.md, add a link to the lesson under "## Contents", in a
                 "### Daily Lessons" sub-list (create it if missing).
               - Markdown files only. Do not touch .github/ or edit other existing notes.

            3. Ship it (run these exactly, filling in NNN and the topic)
               git checkout -b daily-lesson/${{ steps.today.outputs.date }}
               git add -A
               git commit -m "Add daily lesson NNN: <topic>"
               git push -u origin daily-lesson/${{ steps.today.outputs.date }}
               gh pr create --base main --title "Daily lesson NNN: <topic>" --body "Daily lesson for ${{ steps.today.outputs.date }}: <one-sentence summary>. Merges on its own once all required checks pass."
               gh pr merge --auto --squash
